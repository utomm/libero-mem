[project]
name = "libero"
version = "0.1.0"
description = "LIBERO-Mem simulation and evaluation environment"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "bddl==1.0.1",
    "cloudpickle==2.1.0",
    "easydict==1.9",
    "future==0.18.2",
    "gym==0.25.2",
    "h5py==3.11.0",
    "imageio==2.35.1",
    "matplotlib==3.5.3",
    "mujoco==3.2.2",
    "numpy==1.22.4",
    "opencv-python==4.6.0.66",
    "openpi-client==0.1.0",
    "pyyaml>=6.0,<7",
    "robomimic==0.3.0",
    "robosuite==1.4.1",
    "torch==1.11.0+cu113",
    "torchvision==0.12.0+cu113",
    "tqdm==4.66.5",
    "tyro==0.5.0",
]

[tool.uv.sources]
openpi-client = { path = "openpi-client", editable = true }
robomimic = { path = "thirdparty/robomimic", editable = true }
robosuite = { path = "thirdparty/robosuite", editable = true }

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu113"]

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake==3.25.0", "setuptools"]

[dependency-groups]
dev = ["cmake==3.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libero"]
