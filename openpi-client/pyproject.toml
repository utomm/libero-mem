[project]
name = "openpi-client"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "msgpack>=1.0.5",
    "numpy>=1.22.4,<2.0.0",
    "typing-extensions>=4.0",
    "websockets>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpi_client"]
